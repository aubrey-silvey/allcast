[package]
name = "allcast"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "allcast"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
gstreamer.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Cross-platform config storage + serialization (always needed).
dirs = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# GUI first-run/config window. Optional: headless builds (e.g. the Pi receiver)
# compile with `--no-default-features` to skip the entire eframe/winit/wayland/
# x11/glow dependency tree.
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
egui = { version = "0.30", optional = true }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]
